name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  IMAGE: ghcr.io/${{ github.repository }}/server

jobs:
  validate:
    name: Validate tag against package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check versions match
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const server = JSON.parse(await readFile('server/package.json', 'utf8'))
          const expected = 'v' + server.version
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME)
          }
          NODE

  docker:
    name: Publish image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
