name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r check
      - run: pnpm test

  server-postgres:
    name: Store smoke on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsh
          POSTGRES_PASSWORD: dsh
          POSTGRES_DB: dsh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run store tests against PostgreSQL
        env:
          DATABASE_URL: postgres://dsh:dsh@127.0.0.1:5432/dsh
        run: pnpm test:pg
      - name: Protocol walkthrough (two simulated peers)
        env:
          DATABASE_URL: postgres://dsh:dsh@127.0.0.1:5432/dshwalk
        run: |
          (cd server && node --input-type=module -e "
            import pg from 'pg'
            const client = new pg.Client({ connectionString: 'postgres://dsh:dsh@127.0.0.1:5432/postgres' })
            await client.connect()
            await client.query('CREATE DATABASE dshwalk')
            await client.end()
          ")
          node server/scripts/protocol-walkthrough.mjs
      - name: Client compatibility walkthrough
        env:
          DATABASE_URL: postgres://dsh:dsh@127.0.0.1:5432/dshcompat
        run: |
          (cd server && node --input-type=module -e "
            import pg from 'pg'
            const client = new pg.Client({ connectionString: 'postgres://dsh:dsh@127.0.0.1:5432/postgres' })
            await client.connect()
            await client.query('CREATE DATABASE dshcompat')
            await client.end()
          ")
          node server/scripts/client-compat-walkthrough.mjs

  docker-build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: false
          tags: dsh-remote-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
