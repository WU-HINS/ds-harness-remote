name: dsh-remote-server

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsh
      POSTGRES_USER: dsh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsh -d dsh"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/wu-hins/ds-harness-remote/server:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dsh:${POSTGRES_PASSWORD}@postgres:5432/dsh
      DSH_SERVER_PUBLIC_URL: ${DSH_SERVER_PUBLIC_URL:?}
      DSH_SERVER_PORT: 8080
      DSH_SERVER_HOST: 0.0.0.0
      DSH_SERVER_TRUSTED_PROXY_IPS: ${DSH_SERVER_TRUSTED_PROXY_IPS:-}
      DSH_SETUP_KEY: ${DSH_SETUP_KEY:-}
      DSH_SESSION_TTL_MS: ${DSH_SESSION_TTL_MS:-28800000}
      DSH_USER_RATE_PER_MINUTE: ${DSH_USER_RATE_PER_MINUTE:-600}
      DSH_ANON_RATE_PER_MINUTE: ${DSH_ANON_RATE_PER_MINUTE:-30}
      DSH_USER_CONNECTION_LIMIT: ${DSH_USER_CONNECTION_LIMIT:-16}
      DSH_OIDC_ISSUER: ${DSH_OIDC_ISSUER:-}
      DSH_OIDC_CLIENT_ID: ${DSH_OIDC_CLIENT_ID:-}
      DSH_OIDC_CLIENT_SECRET: ${DSH_OIDC_CLIENT_SECRET:-}
      DSH_OIDC_ALLOWED_DOMAINS: ${DSH_OIDC_ALLOWED_DOMAINS:-}
      DSH_SMTP_HOST: ${DSH_SMTP_HOST:-}
      DSH_SMTP_PORT: ${DSH_SMTP_PORT:-587}
      DSH_SMTP_SECURE: ${DSH_SMTP_SECURE:-0}
      DSH_SMTP_USER: ${DSH_SMTP_USER:-}
      DSH_SMTP_PASS: ${DSH_SMTP_PASS:-}
      DSH_SMTP_FROM: ${DSH_SMTP_FROM:-}
      DSH_SERVER_STUN_URLS: ${DSH_SERVER_STUN_URLS:-}
      DSH_SERVER_TURN_URLS: ${DSH_SERVER_TURN_URLS:-}
      DSH_SERVER_TURN_USERNAME: ${DSH_SERVER_TURN_USERNAME:-}
      DSH_SERVER_TURN_PASSWORD: ${DSH_SERVER_TURN_PASSWORD:-}
      DSH_SERVER_LOG_LEVEL: ${DSH_SERVER_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
